class Component extends DCLogic {
  renderVals() {
    const list = [
      ['throughout', 'протягом, упродовж', 0.72, 0], ['awkward', 'незграбний, ніяковий', 0.81, 0],
      ['to figure out', 'з’ясувати, розібратися', 0.35, 0], ['reliable', 'надійний', 0.18, 1],
      ['eventually', 'зрештою, врешті-решт', 0.55, 0], ['to put off', 'відкладати', 0.64, 1],
      ['thorough', 'ретельний', 0.76, 1], ['whereas', 'тоді як', 0.47, 0],
      ['to look forward to', 'чекати з нетерпінням', 0.29, 0], ['meanwhile', 'тим часом', 0.12, 0],
      ['to come up with', 'придумати, вигадати', 0.38, 0], ['to be supposed to', 'мати (щось зробити)', 0.42, 0]
    ];
    const rows = list.map((r, i) => ({
      word: r[0], tr: r[1],
      dot: r[3] ? '#FFC23A' : '#5B9BFF',
      barW: Math.round(6 + r[2] * 58) + 'px',
      barColor: r[2] >= 0.6 ? '#A9C8FF' : '#3D7BEA',
      bg: i === 1 ? '#2E2710' : 'transparent'
    }));
    return { rows };
  }
}
