<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Parrot — палітри</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;color:#14202E}
button{font-family:inherit}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div style="width: 1368px; height: 660px; box-sizing: border-box; padding: 48px; background: #ECEAE4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px;">
<sc-for list="{{pals}}" as="p" hint-placeholder-count="4">
<div style="background: {{p.paper}}; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px; border: 1px solid rgba(20, 32, 46, 0.06);">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 17px; font-weight: 650; letter-spacing: -0.01em;">{{p.name}}</span>
<span style="font-size: 12px; color: #5E6878;">{{p.ratioText}}</span>
</div>
<div style="display: flex; height: 14px; border-radius: 7px; overflow: hidden; border: 1px solid rgba(20, 32, 46, 0.1);">
<span style="background: #FFFFFF; width: {{p.rN}};"></span>
<span style="background: {{p.b6}}; width: {{p.rB}};"></span>
<span style="background: {{p.y5}}; width: {{p.rY}};"></span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{p.sw}}" as="s" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 5px;">
<span style="height: 40px; border-radius: 10px; background: {{s.c}}; border: 1px solid rgba(20, 32, 46, 0.08);"></span>
<span style="font-size: 11px; color: #3A4555; font-weight: 500;">{{s.n}}</span>
<span style="font-size: 11px; color: #5E6878; font-family: ui-monospace, Consolas, monospace;">{{s.c}}</span>
</div>
</sc-for>
</div>
<div style="background: #FFFFFF; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; margin-top: auto;">
<div style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 10px; background: {{p.b1}}; color: {{p.b9}}; font-size: 13px; font-weight: 600;"><svg class="i" width="16" height="16" viewBox="0 0 24 24" style="color: {{p.b6}};"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg><span style="flex-grow: 1;">Словник</span><span style="font-weight: 500;">419</span></div>
<div style="display: flex; gap: 8px; align-items: center;">
<button style="height: 34px; padding: 0 14px; border: 0; border-radius: 10px; background: {{p.btn}}; color: {{p.btnText}}; font-size: 13px; font-weight: 600;">Додати</button>
<span style="height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid #E1DED4; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; color: #3A4555;"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{p.y5}};"></span>Складні 38</span>
</div>
<div style="display: flex; align-items: center; gap: 10px;">
<span style="width: 30px; height: 30px; border-radius: 9px; background: {{p.y1}}; color: {{p.yInk}}; display: flex; align-items: center; justify-content: center;"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4.1 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg></span>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px;">
<span style="height: 6px; border-radius: 3px; background: {{p.y5}};"></span><span style="height: 6px; border-radius: 3px; background: {{p.y5}};"></span><span style="height: 6px; border-radius: 3px; background: {{p.y5}};"></span><span style="height: 6px; border-radius: 3px; background: {{p.y5}};"></span><span style="height: 6px; border-radius: 3px; background: {{p.y5}};"></span><span style="height: 6px; border-radius: 3px; background: {{p.y5}};"></span><span style="height: 6px; border-radius: 3px; background: #ECEAE3;"></span>
</div>
</div>
<div style="display: flex; align-items: flex-end; gap: 4px; height: 56px;">
<sc-for list="{{p.bars}}" as="b" hint-placeholder-count="14">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%;">
<div style="background: {{p.y5}}; border-radius: 2px 2px 0 0; height: {{b.w}};"></div>
<div style="background: {{p.b6}}; height: {{b.c}};"></div>
</div>
</sc-for>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1368,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    const c = [8, 11, 7, 12, 13, 9, 14, 12, 10, 15, 13, 16, 12, 14];
    const w = [3, 2, 3, 2, 1, 3, 2, 2, 3, 1, 2, 1, 2, 2];
    const bars = c.map((v, i) => ({ c: v * 2.8 + 'px', w: w[i] * 2.8 + 'px' }));
    const mk = (p) => ({
      ...p,
      bars,
      ratioText: p.ratio,
      sw: [
        { n: 'Синій глибокий', c: p.b9 }, { n: 'Синій', c: p.b6 }, { n: 'Синій світлий', c: p.b1 },
        { n: 'Жовтий', c: p.y5 }, { n: 'Жовтий світлий', c: p.y1 }, { n: 'Фон', c: p.paper }
      ]
    });
    const pals = [
      mk({ name: 'A · Кобальт і сонце', ratio: 'Зараз у макетах · 70 / 22 / 8', rN: '70%', rB: '22%', rY: '8%',
        b9: '#1340A6', b6: '#2D7DF6', b1: '#E3EDFF', y5: '#F5B324', y1: '#FFF3D1', yInk: '#8A5A00', paper: '#F4F3EE', btn: '#1F66D9', btnText: '#FFFFFF' }),
      mk({ name: 'B · Індиго і мед', ratio: 'Глибше, спокійніше · 70 / 20 / 10', rN: '70%', rB: '20%', rY: '10%',
        b9: '#1E2A7A', b6: '#4257E8', b1: '#E6E9FF', y5: '#F2A516', y1: '#FDEBC8', yInk: '#7F4F00', paper: '#F6F4EF', btn: '#3346C9', btnText: '#FFFFFF' }),
      mk({ name: 'C · Небо і лимон', ratio: 'Світліше, свіжіше · 72 / 20 / 8', rN: '72%', rB: '20%', rY: '8%',
        b9: '#0A4D80', b6: '#1E9BF0', b1: '#E1F3FF', y5: '#FFD43B', y1: '#FFF8D6', yInk: '#7A6100', paper: '#F3F6F8', btn: '#0B78C9', btnText: '#FFFFFF' }),
      mk({ name: 'D · Жовтий веде', ratio: 'Жовтий — головна дія · 68 / 12 / 20', rN: '68%', rB: '12%', rY: '20%',
        b9: '#15307A', b6: '#2F6BF2', b1: '#E6EEFF', y5: '#FFC23A', y1: '#FFF1CC', yInk: '#7A5200', paper: '#F7F5EF', btn: '#FFC23A', btnText: '#14202E' })
    ];
    return { pals };
  }
}
</script>
</body>
</html>
